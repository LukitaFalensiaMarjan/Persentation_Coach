<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password baru — Persentation Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<main class="frame">
  <header id="nav" class="nav"></header>
  <div class="page"><div class="auth">
    <div><h1 id="judul">Buat<br>password baru</h1><p class="lead" id="ket">Pilih password baru yang belum pernah kamu pakai. Setelah disimpan, kamu keluar dari semua perangkat dan masuk lagi dengan password baru.</p></div>
    <form class="card" id="form" novalidate hidden>
      <h2 class="card-title">Password baru</h2>
      <div class="field"><label for="password">Password baru</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="minimal 8 karakter" required></div>
      <div class="field"><label for="password2">Ulangi password</label><input id="password2" name="password2" type="password" autocomplete="new-password" placeholder="ketik ulang" required></div>
      <div class="rules" id="rules"></div>
      <p class="msg" id="msg" role="alert"></p>
      <button class="btn solid" type="submit">Simpan password</button>
    </form>
    <div class="card" id="gagal" hidden><p class="note" id="isi"></p><a class="btn solid" href="/lupa-password">Minta tautan baru</a></div>
  </div></div>
</main>
<script src="/static/js/shared.js"></script>
<script src="/static/js/reset.js"></script>
</body>
</html>
