<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar — Persentation Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<main class="frame">
  <header id="nav" class="nav"></header>
  <div class="page"><div class="auth">
    <div><h1>Mulai berlatih<br>hari ini</h1><p class="lead">Buat akun untuk menyimpan riwayat latihan, laporan PDF, dan terhubung dengan bot Telegram Anda.</p></div>
    <form class="card" id="form" novalidate>
      <h2 class="card-title">Buat akun</h2>
      <div class="field"><label for="nama">Nama lengkap</label><input id="nama" name="nama" autocomplete="name" maxlength="80" placeholder="Nama sesuai identitas" required></div>
      <div class="row2">
        <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" maxlength="20" placeholder="huruf kecil, angka, _" required></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="nama@email.com" required></div>
      </div>
      <div class="row2">
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="minimal 8 karakter" required></div>
        <div class="field"><label for="password2">Ulangi password</label><input id="password2" name="password2" type="password" autocomplete="new-password" placeholder="ketik ulang" required></div>
      </div>
      <p class="msg" id="msg" role="alert"></p>
      <button class="btn solid" type="submit">Daftar</button>
      <div class="sep">atau</div>
      <div class="gbtn" id="gbtn"></div>
      <p class="alt">Sudah punya akun? <a href="/masuk">Masuk</a></p>
    </form>
  </div></div>
</main>
<script src="/static/js/shared.js"></script>
<script src="/static/js/auth.js"></script>
</body>
</html>
